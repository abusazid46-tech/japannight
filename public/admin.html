<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Teer Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <!-- Login Form -->
        <div id="loginForm" class="card mx-auto" style="max-width: 450px;">
            <div class="card-header bg-dark text-white text-center">
                <h4>🔐 Admin Login</h4>
            </div>
            <div class="card-body">
                <div class="alert alert-info">
                    <small>Default password: <strong>admin123</strong></small>
                </div>
                <input type="password" id="adminPassword" class="form-control mb-3" 
                       placeholder="Enter Admin Password" onkeypress="if(event.key==='Enter') login()">
                <button onclick="login()" class="btn btn-dark w-100">Login</button>
                <div id="loginError" class="text-danger mt-2 text-center"></div>
            </div>
        </div>

        <!-- Admin Dashboard -->
        <div id="adminDashboard" style="display: none;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>Admin Dashboard</h1>
                <button onclick="logout()" class="btn btn-danger">Logout</button>
            </div>
            
            <ul class="nav nav-tabs mb-4">
                <li class="nav-item">
                    <a class="nav-link active" href="#" onclick="showSection('results'); return false;">📊 Update Results</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="showSection('common'); return false;">🔢 Common Numbers</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="showSection('dreams'); return false;">💭 Add Dream</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="showSection('manage'); return false;">📋 Manage Data</a>
                </li>
            </ul>

            <!-- Update Results Section -->
            <div id="resultsSection" class="admin-section active-section">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Update Today's Results</h5>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info">
                            Today's Date: <strong id="todayDate"></strong>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">First Round (10:30 AM)</label>
                            <input type="text" id="firstRound" class="form-control" 
                                   placeholder="e.g., 08" maxlength="2" pattern="\d{2}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Second Round (11:30 AM)</label>
                            <input type="text" id="secondRound" class="form-control" 
                                   placeholder="e.g., 51" maxlength="2" pattern="\d{2}">
                        </div>
                        <button onclick="updateResults()" class="btn btn-primary">Update Results</button>
                        <div id="resultMsg" class="mt-3"></div>
                    </div>
                </div>
            </div>

            <!-- Common Numbers Section -->
            <div id="commonSection" class="admin-section" style="display:none">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0">Update Common Numbers</h5>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info">
                            Today's Date: <strong id="todayDate2"></strong>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Direct Numbers (comma separated)</label>
                            <input type="text" id="direct" class="form-control" 
                                   placeholder="e.g., 68,39,81">
                            <small class="text-muted">Example: 68,39,81</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">House Numbers (comma separated)</label>
                            <input type="text" id="house" class="form-control" 
                                   placeholder="e.g., 4,5">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ending Numbers (comma separated)</label>
                            <input type="text" id="ending" class="form-control" 
                                   placeholder="e.g., 7,2">
                        </div>
                        <button onclick="updateCommon()" class="btn btn-danger">Update Common Numbers</button>
                        <div id="commonMsg" class="mt-3"></div>
                    </div>
                </div>
            </div>

            <!-- Add Dream Section -->
            <div id="dreamsSection" class="admin-section" style="display:none">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Add New Dream Meaning</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Dream Description</label>
                            <input type="text" id="dreamName" class="form-control" 
                                   placeholder="e.g., Seeing a white elephant">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Direct Numbers (comma separated)</label>
                            <input type="text" id="dreamDirect" class="form-control" 
                                   placeholder="e.g., 09,17,37">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">House Numbers (comma separated)</label>
                            <input type="text" id="dreamHouse" class="form-control" 
                                   placeholder="e.g., 7">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ending Numbers (comma separated)</label>
                            <input type="text" id="dreamEnding" class="form-control" 
                                   placeholder="e.g., 9">
                        </div>
                        <button onclick="addDream()" class="btn btn-success">Add Dream</button>
                        <div id="dreamMsg" class="mt-3"></div>
                    </div>
                </div>
            </div>

            <!-- Manage Data Section -->
            <div id="manageSection" class="admin-section" style="display:none">
                <div class="row">
                    <div class="col-md-6">
                        <div class="card mb-4">
                            <div class="card-header bg-info text-white">
                                <h5 class="mb-0">Manage Results</h5>
                            </div>
                            <div class="card-body" style="max-height: 400px; overflow-y: auto;">
                                <div id="resultsList"></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card mb-4">
                            <div class="card-header bg-warning">
                                <h5 class="mb-0">Manage Dreams</h5>
                            </div>
                            <div class="card-body" style="max-height: 400px; overflow-y: auto;">
                                <div id="dreamsList"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isLoggedIn = false;
        
        document.getElementById('todayDate').innerText = new Date().toLocaleDateString('en-GB');
        document.getElementById('todayDate2').innerText = new Date().toLocaleDateString('en-GB');
        
        function login() {
            const password = document.getElementById('adminPassword').value;
            fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    isLoggedIn = true;
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('adminDashboard').style.display = 'block';
                    loadManageData();
                } else {
                    document.getElementById('loginError').innerText = 'Wrong password!';
                }
            });
        }
        
        function logout() {
            isLoggedIn = false;
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('adminDashboard').style.display = 'none';
            document.getElementById('adminPassword').value = '';
            document.getElementById('loginError').innerText = '';
        }
        
        function showSection(section) {
            document.querySelectorAll('.admin-section').forEach(s => s.style.display = 'none');
            if (section === 'results') {
                document.getElementById('resultsSection').style.display = 'block';
            } else if (section === 'common') {
                document.getElementById('commonSection').style.display = 'block';
            } else if (section === 'dreams') {
                document.getElementById('dreamsSection').style.display = 'block';
            } else if (section === 'manage') {
                document.getElementById('manageSection').style.display = 'block';
                loadManageData();
            }
            
            // Update active tab
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
            });
            event.target.classList.add('active');
        }
        
        function updateResults() {
            const firstRound = document.getElementById('firstRound').value;
            const secondRound = document.getElementById('secondRound').value;
            
            if (!firstRound || !secondRound) {
                showMessage('resultMsg', 'Please fill both rounds', 'error');
                return;
            }
            
            fetch('/api/admin/update-result', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ firstRound, secondRound })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showMessage('resultMsg', '✅ Results updated successfully!', 'success');
                    document.getElementById('firstRound').value = '';
                    document.getElementById('secondRound').value = '';
                } else {
                    showMessage('resultMsg', 'Error updating results', 'error');
                }
            });
        }
        
        function updateCommon() {
            const direct = document.getElementById('direct').value.split(',').map(s => s.trim());
            const house = document.getElementById('house').value.split(',').map(s => s.trim());
            const ending = document.getElementById('ending').value.split(',').map(s => s.trim());
            
            fetch('/api/admin/update-common', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ direct, house, ending })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showMessage('commonMsg', '✅ Common numbers updated successfully!', 'success');
                    document.getElementById('direct').value = '';
                    document.getElementById('house').value = '';
                    document.getElementById('ending').value = '';
                } else {
                    showMessage('commonMsg', 'Error updating common numbers', 'error');
                }
            });
        }
        
        function addDream() {
            const dreamName = document.getElementById('dreamName').value;
            const direct = document.getElementById('dreamDirect').value;
            const house = document.getElementById('dreamHouse').value;
            const ending = document.getElementById('dreamEnding').value;
            
            if (!dreamName) {
                showMessage('dreamMsg', 'Please enter dream description', 'error');
                return;
            }
            
            fetch('/api/admin/add-dream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ dream: dreamName, direct, house, ending })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showMessage('dreamMsg', '✅ Dream added successfully!', 'success');
                    document.getElementById('dreamName').value = '';
                    document.getElementById('dreamDirect').value = '';
                    document.getElementById('dreamHouse').value = '';
                    document.getElementById('dreamEnding').value = '';
                } else {
                    showMessage('dreamMsg', 'Error adding dream', 'error');
                }
            });
        }
        
        async function loadManageData() {
            // Load results
            const resultsRes = await fetch('/api/admin/all-results');
            const results = await resultsRes.json();
            
            const resultsList = document.getElementById('resultsList');
            if (results.length === 0) {
                resultsList.innerHTML = '<p>No results found</p>';
            } else {
                resultsList.innerHTML = results.map(result => `
                    <div class="card mb-2">
                        <div class="card-body">
                            <strong>${result.date}</strong><br>
                            FR: ${result.data?.firstRound || '--'} | SR: ${result.data?.secondRound || '--'}
                            <button onclick="deleteResult('${result._id}')" class="btn btn-sm btn-danger mt-2">
                                Delete
                            </button>
                        </div>
                    </div>
                `).join('');
            }
            
            // Load dreams
            const dreamsRes = await fetch('/api/dreams');
            const dreams = await dreamsRes.json();
            
            const dreamsList = document.getElementById('dreamsList');
            if (dreams.length === 0) {
                dreamsList.innerHTML = '<p>No dreams found</p>';
            } else {
                dreamsList.innerHTML = dreams.map(dream => `
                    <div class="card mb-2">
                        <div class="card-body">
                            <strong>${dream.data.dream}</strong><br>
                            Direct: ${dream.data.direct || 'N/A'}
                            <button onclick="deleteDream('${dream._id}')" class="btn btn-sm btn-danger mt-2">
                                Delete
                            </button>
                        </div>
                    </div>
                `).join('');
            }
        }
        
        async function deleteResult(id) {
            if (confirm('Are you sure you want to delete this result?')) {
                await fetch(`/api/admin/delete-result/${id}`, { method: 'DELETE' });
                loadManageData();
            }
        }
        
        async function deleteDream(id) {
            if (confirm('Are you sure you want to delete this dream?')) {
                await fetch(`/api/admin/delete-dream/${id}`, { method: 'DELETE' });
                loadManageData();
            }
        }
        
        function showMessage(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="alert alert-${type === 'success' ? 'success' : 'danger'}">${message}</div>`;
            setTimeout(() => element.innerHTML = '', 3000);
        }
        
        // Check if admin tries to access dashboard directly
        if (window.location.hash === '#admin') {
            // Stay on login page
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
