<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .admin-section { display: none; }
        .active-section { display: block; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <!-- Login Form -->
        <div id="loginForm" class="card mx-auto" style="max-width: 400px;">
            <div class="card-header bg-dark text-white">
                <h4>Admin Login</h4>
            </div>
            <div class="card-body">
                <input type="password" id="adminPassword" class="form-control mb-3" placeholder="Enter Password">
                <button onclick="login()" class="btn btn-dark w-100">Login</button>
                <div id="loginError" class="text-danger mt-2"></div>
            </div>
        </div>

        <!-- Admin Dashboard -->
        <div id="adminDashboard" style="display: none;">
            <h1 class="mb-4">Admin Dashboard</h1>
            
            <ul class="nav nav-tabs mb-4">
                <li class="nav-item">
                    <a class="nav-link active" onclick="showSection('results')">Update Results</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" onclick="showSection('common')">Common Numbers</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" onclick="showSection('dreams')">Dream Numbers</a>
                </li>
            </ul>

            <!-- Update Results Section -->
            <div id="resultsSection" class="admin-section active-section">
                <div class="card">
                    <div class="card-header">
                        <h5>Update Today's Results</h5>
                    </div>
                    <div class="card-body">
                        <input type="text" id="firstRound" class="form-control mb-2" placeholder="First Round (e.g., 08)" maxlength="2">
                        <input type="text" id="secondRound" class="form-control mb-2" placeholder="Second Round (e.g., 51)" maxlength="2">
                        <button onclick="updateResults()" class="btn btn-primary">Update Results</button>
                        <div id="resultMsg" class="mt-2"></div>
                    </div>
                </div>
            </div>

            <!-- Common Numbers Section -->
            <div id="commonSection" class="admin-section" style="display:none">
                <div class="card">
                    <div class="card-header">
                        <h5>Update Common Numbers</h5>
                    </div>
                    <div class="card-body">
                        <input type="text" id="direct" class="form-control mb-2" placeholder="Direct numbers (comma separated, e.g., 68,39,81)">
                        <input type="text" id="house" class="form-control mb-2" placeholder="House numbers (comma separated, e.g., 4,5)">
                        <input type="text" id="ending" class="form-control mb-2" placeholder="Ending numbers (comma separated, e.g., 7,2)">
                        <button onclick="updateCommon()" class="btn btn-primary">Update Common Numbers</button>
                        <div id="commonMsg" class="mt-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function login() {
            const password = document.getElementById('adminPassword').value;
            fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('adminDashboard').style.display = 'block';
                } else {
                    document.getElementById('loginError').innerText = 'Wrong password!';
                }
            });
        }

        function updateResults() {
            const firstRound = document.getElementById('firstRound').value;
            const secondRound = document.getElementById('secondRound').value;
            
            fetch('/api/admin/update-result', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ firstRound, secondRound })
            })
            .then(res => res.json())
            .then(() => {
                document.getElementById('resultMsg').innerHTML = '<div class="alert alert-success">✅ Results updated!</div>';
                setTimeout(() => document.getElementById('resultMsg').innerHTML = '', 2000);
            });
        }

        function updateCommon() {
            const direct = document.getElementById('direct').value.split(',').map(s => s.trim());
            const house = document.getElementById('house').value.split(',').map(s => s.trim());
            const ending = document.getElementById('ending').value.split(',').map(s => s.trim());
            
            fetch('/api/admin/update-common', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ direct, house, ending })
            })
            .then(res => res.json())
            .then(() => {
                document.getElementById('commonMsg').innerHTML = '<div class="alert alert-success">✅ Common numbers updated!</div>';
                setTimeout(() => document.getElementById('commonMsg').innerHTML = '', 2000);
            });
        }

        function showSection(section) {
            document.querySelectorAll('.admin-section').forEach(s => s.style.display = 'none');
            if (section === 'results') document.getElementById('resultsSection').style.display = 'block';
            if (section === 'common') document.getElementById('commonSection').style.display = 'block';
        }
    </script>
</body>
</html>
