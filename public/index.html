<!DOCTYPE html>
<html>
<head>
    <title>Teer Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">🎯 Teer Results</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link" href="/results.html">Results</a>
                <a class="nav-link" href="/common.html">Common Numbers</a>
                <a class="nav-link" href="/dreams.html">Dream Numbers</a>
                <a class="nav-link" href="/admin.html">Admin</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="card text-center">
            <div class="card-header bg-primary text-white">
                <h3>Today's Results - <span id="date"></span></h3>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <div class="result-box">
                            <h4>First Round (10:30 AM)</h4>
                            <div class="display-1 fw-bold text-primary" id="firstRound">--</div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="result-box">
                            <h4>Second Round (11:30 AM)</h4>
                            <div class="display-1 fw-bold text-success" id="secondRound">--</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load today's date
        document.getElementById('date').innerText = new Date().toLocaleDateString('en-GB');
        
        // Fetch today's result
        fetch('/api/today-result')
            .then(res => res.json())
            .then(data => {
                if (data.data) {
                    document.getElementById('firstRound').innerText = data.data.firstRound;
                    document.getElementById('secondRound').innerText = data.data.secondRound;
                }
            });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
