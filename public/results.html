<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previous Results - Teer Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">🎯 Teer Results</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="/">Home</a>
                    <a class="nav-link active" href="/results.html">Results</a>
                    <a class="nav-link" href="/common.html">Common Numbers</a>
                    <a class="nav-link" href="/dreams.html">Dream Numbers</a>
                    <a class="nav-link" href="/admin.html">Admin</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 class="text-center mb-4">📊 Previous Results</h1>
        
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">All Shillong Teer Results</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Date</th>
                                <th>First Round</th>
                                <th>Second Round</th>
                            </tr>
                        </thead>
                        <tbody id="resultsTable">
                            <tr>
                                <td colspan="3" class="text-center">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Teer Results. All rights reserved.</p>
        <p>⚠️ For entertainment purposes only. No guarantee of accuracy.</p>
    </footer>

    <script>
        async function loadResults() {
            try {
                const response = await fetch('/api/results');
                const results = await response.json();
                
                const tableBody = document.getElementById('resultsTable');
                
                if (results.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="3" class="text-center">No results found</td></tr>';
                    return;
                }
                
                tableBody.innerHTML = results.map(result => `
                    <tr>
                        <td><strong>${result.date}</strong></td>
                        <td><span class="badge bg-primary fs-6">${result.data?.firstRound || '--'}</span></td>
                        <td><span class="badge bg-success fs-6">${result.data?.secondRound || '--'}</span></td>
                    </tr>
                `).join('');
            } catch (error) {
                document.getElementById('resultsTable').innerHTML = 
                    '<tr><td colspan="3" class="text-center text-danger">Error loading results</td></tr>';
            }
        }
        
        loadResults();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
