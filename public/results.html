<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previous Results - Khanapara Morning Teer Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #f5f0eb;
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
        }

        /* ── HEADER ── */
        .site-header {
            background: linear-gradient(90deg, #1a8fa0 0%, #16b0c8 100%);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .site-header .logo-icon {
            width: 44px; height: 44px;
            background: #fff;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            text-decoration: none;
        }
        .site-header h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            color: #fff;
            letter-spacing: 1px;
            margin: 0;
        }
        .site-header a { text-decoration: none; color: #fff; }

        /* ── PAGE CONTENT ── */
        .page-content {
            padding: 20px 12px 30px;
            max-width: 960px;
            margin: 0 auto;
        }

        /* ── EXCEL-STYLE RESULTS TABLE ── */
        .results-table-wrapper {
            background: #fff;
            border: 2px solid #555;
            border-radius: 4px;
            overflow: hidden;
        }

        .results-title-row {
            background: #fff;
            text-align: center;
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #111;
            padding: 8px 4px;
            border-bottom: 1px solid #888;
            letter-spacing: 2px;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Roboto', sans-serif;
            table-layout: fixed;
        }

        .results-table th,
        .results-table td {
            border: 1px solid #aaa;
            text-align: center;
            padding: 7px 4px;
            font-size: 0.9rem;
            vertical-align: middle;
        }

        .results-table thead th {
            background: #16b0c8;
            color: #fff;
            font-family: 'Oswald', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            border-color: #888;
        }

        /* Column widths: CITY wide, DATE wide, F/R narrow, S/R narrow */
        .results-table th:nth-child(1),
        .results-table td:nth-child(1) { width: 30%; }
        .results-table th:nth-child(2),
        .results-table td:nth-child(2) { width: 40%; }
        .results-table th:nth-child(3),
        .results-table td:nth-child(3) { width: 15%; }
        .results-table th:nth-child(4),
        .results-table td:nth-child(4) { width: 15%; }

        .results-table tbody tr:nth-child(even) {
            background: #f9f9f9;
        }
        .results-table tbody tr:hover {
            background: #e8f7f9;
        }
        .results-table tbody td {
            color: #222;
            font-size: 0.88rem;
        }
        /* F/R and S/R number cells */
        .results-table tbody td:nth-child(3),
        .results-table tbody td:nth-child(4) {
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            color: #111;
        }

        /* Loading / error states */
        .state-row td {
            padding: 30px;
            color: #888;
            font-size: 0.95rem;
        }

        /* ── PAGINATION ── */
        .pagination-wrap {
            margin-top: 16px;
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .page-btn {
            background: #fff;
            border: 1px solid #16b0c8;
            color: #16b0c8;
            border-radius: 4px;
            padding: 5px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: 'Oswald', sans-serif;
            transition: background 0.15s, color 0.15s;
        }
        .page-btn:hover, .page-btn.active {
            background: #16b0c8;
            color: #fff;
        }
        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ── NOTE ── */
        .note {
            margin-top: 14px;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 0.82rem;
            color: #555;
        }

        /* ── FOOTER ── */
        footer {
            background: #222;
            color: #aaa;
            text-align: center;
            padding: 16px;
            font-size: 0.8rem;
            margin-top: 20px;
        }
        footer p { margin: 4px 0; }

        @media (max-width: 480px) {
            .results-table th, .results-table td { font-size: 0.78rem; padding: 6px 2px; }
            .results-table tbody td:nth-child(3),
            .results-table tbody td:nth-child(4) { font-size: 0.88rem; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="site-header">
        <a class="logo-icon" href="/">🎯</a>
        <a href="/"><h1>Khanapara Morning Teer Result</h1></a>
    </header>

    <!-- CONTENT -->
    <div class="page-content">

        <div class="results-table-wrapper">
            <div class="results-title-row">RESULTS</div>
            <table class="results-table">
                <thead>
                    <tr>
                        <th>CITY</th>
                        <th>DATE</th>
                        <th>F/R</th>
                        <th>S/R</th>
                    </tr>
                </thead>
                <tbody id="resultsTable">
                    <tr class="state-row">
                        <td colspan="4">Loading results...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination-wrap" id="pagination"></div>

        <div class="note">
            <strong>📌 Note:</strong> Showing last 50 results. Use the admin panel to add new results.
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; Khanapara Morning Teer Result. All rights reserved.</p>
        <p>⚠️ For entertainment purposes only. No guarantee of accuracy.</p>
    </footer>

    <script>
        const API_BASE_URL = 'https://teer-website.onrender.com';

        let currentPage = 1;
        let totalPages = 1;

        async function loadResults(page = 1) {
            const tableBody = document.getElementById('resultsTable');
            tableBody.innerHTML = `<tr class="state-row"><td colspan="4">Loading results...</td></tr>`;

            try {
                const response = await fetch(`${API_BASE_URL}/api/results?page=${page}&limit=50`);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();

                let results = [];
                if (data.data && Array.isArray(data.data)) {
                    results = data.data;
                    totalPages = data.totalPages || Math.ceil((data.total || results.length) / 50);
                } else if (Array.isArray(data)) {
                    results = data; totalPages = 1;
                } else if (data.results && Array.isArray(data.results)) {
                    results = data.results; totalPages = 1;
                }

                if (results.length === 0) {
                    tableBody.innerHTML = `<tr class="state-row"><td colspan="4">No results found. Use admin panel to add results.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = results.map(result => {
                    const rd = result.data || result;
                    const date = result.date || 'Unknown';
                    const fr = (rd.firstRound || rd.first_round || '--').toString().padStart(2, '0');
                    const sr = (rd.secondRound || rd.second_round || '--').toString().padStart(2, '0');
                    return `
                        <tr>
                            <td>Khanapara</td>
                            <td>${date}</td>
                            <td>${fr}</td>
                            <td>${sr}</td>
                        </tr>`;
                }).join('');

                renderPagination(page);

            } catch (e) {
                tableBody.innerHTML = `<tr class="state-row"><td colspan="4" style="color:#c00;">
                    ❌ Error loading results. Backend may not be connected.<br>
                    <small>${e.message}</small>
                </td></tr>`;
            }
        }

        function renderPagination(page) {
            const wrap = document.getElementById('pagination');
            if (totalPages <= 1) { wrap.innerHTML = ''; return; }

            let html = '';
            html += `<button class="page-btn" onclick="changePage(${page - 1})" ${page === 1 ? 'disabled' : ''}>&#8592; Prev</button>`;

            const start = Math.max(1, page - 2);
            const end = Math.min(totalPages, start + 4);
            for (let i = start; i <= end; i++) {
                html += `<button class="page-btn ${i === page ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
            }

            html += `<button class="page-btn" onclick="changePage(${page + 1})" ${page === totalPages ? 'disabled' : ''}>Next &#8594;</button>`;
            wrap.innerHTML = html;
        }

        function changePage(page) {
            if (page >= 1 && page <= totalPages) {
                currentPage = page;
                loadResults(page);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        loadResults();
        setInterval(() => loadResults(currentPage), 120000);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
