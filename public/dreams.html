<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Numbers - Teer Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">🎯 Teer Results</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="/">Home</a>
                    <a class="nav-link" href="/results.html">Results</a>
                    <a class="nav-link" href="/common.html">Common Numbers</a>
                    <a class="nav-link active" href="/dreams.html">Dream Numbers</a>
                    <a class="nav-link" href="/admin.html">Admin</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 class="text-center mb-4">💭 Dream Number Interpretation</h1>
        
        <div class="search-box">
            <input type="text" id="searchInput" class="form-control" 
                   placeholder="🔍 Search your dream... (e.g., snake, money, tiger)">
        </div>
        
        <div id="dreamsList" class="row">
            <div class="text-center">Loading dreams...</div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Teer Results. All rights reserved.</p>
        <p>⚠️ For entertainment purposes only. No guarantee of accuracy.</p>
    </footer>

    <script>
        let allDreams = [];
        
        async function loadDreams(searchTerm = '') {
            try {
                let url = '/api/dreams';
                if (searchTerm) {
                    url = `/api/search-dream?q=${encodeURIComponent(searchTerm)}`;
                }
                
                const response = await fetch(url);
                const dreams = await response.json();
                allDreams = dreams;
                
                const dreamsList = document.getElementById('dreamsList');
                
                if (dreams.length === 0) {
                    dreamsList.innerHTML = '<div class="alert alert-info">No dreams found matching your search.</div>';
                    return;
                }
                
                dreamsList.innerHTML = dreams.map(dream => `
                    <div class="col-md-6 mb-3">
                        <div class="card dream-card">
                            <div class="card-header bg-primary text-white">
                                <strong>${dream.data.slNo}. ${dream.data.dream}</strong>
                            </div>
                            <div class="card-body">
                                ${dream.data.direct ? `
                                    <div class="mb-2">
                                        <strong>Direct Numbers:</strong><br>
                                        ${dream.data.direct.split(',').map(n => 
                                            `<span class="number-badge">${n.trim()}</span>`
                                        ).join('')}
                                    </div>
                                ` : ''}
                                ${dream.data.house ? `
                                    <div class="mb-2">
                                        <strong>House Numbers:</strong><br>
                                        ${dream.data.house.split(',').map(n => 
                                            `<span class="number-badge house-badge">${n.trim()}</span>`
                                        ).join('')}
                                    </div>
                                ` : ''}
                                ${dream.data.ending ? `
                                    <div>
                                        <strong>Ending Numbers:</strong><br>
                                        ${dream.data.ending.split(',').map(n => 
                                            `<span class="number-badge ending-badge">${n.trim()}</span>`
                                        ).join('')}
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('dreamsList').innerHTML = 
                    '<div class="alert alert-danger">Error loading dreams. Please try again.</div>';
            }
        }
        
        // Search functionality
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                loadDreams(e.target.value);
            }, 300);
        });
        
        // Load all dreams initially
        loadDreams();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
