    <script>
        const API_BASE_URL = 'https://japannight.onrender.com';

        // Date
        const today = new Date();
        const dd = String(today.getDate()).padStart(2, '0');
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const yyyy = today.getFullYear();
        document.getElementById('currentDate').innerText = dd + '/' + mm + '/' + yyyy;

        function parseField(val) {
            if (!val) return '--';
            if (Array.isArray(val)) return val.join(', ');
            return String(val);
        }

        // ============ LOAD COMMON NUMBERS ============
        async function loadCommonNumbers() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/common-numbers`);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();

                if (data && data.data) {
                    const d = data.data;

                    if (d.fr || d.sr) {
                        document.getElementById('frDirect').innerText  = parseField(d.fr?.direct);
                        document.getElementById('frHouse').innerText   = parseField(d.fr?.house);
                        document.getElementById('frEnding').innerText  = parseField(d.fr?.ending);
                        document.getElementById('srDirect').innerText  = parseField(d.sr?.direct);
                        document.getElementById('srHouse').innerText   = parseField(d.sr?.house);
                        document.getElementById('srEnding').innerText  = parseField(d.sr?.ending);
                    } else {
                        const direct  = parseField(d.direct);
                        const house   = parseField(d.house);
                        const ending  = parseField(d.ending);
                        document.getElementById('frDirect').innerText  = direct;
                        document.getElementById('frHouse').innerText   = house;
                        document.getElementById('frEnding').innerText  = ending;
                        document.getElementById('srDirect').innerText  = direct;
                        document.getElementById('srHouse').innerText   = house;
                        document.getElementById('srEnding').innerText  = ending;
                    }
                } else {
                    ['frDirect','frHouse','frEnding','srDirect','srHouse','srEnding']
                        .forEach(id => document.getElementById(id).innerText = 'N/A');
                }
            } catch (e) {
                console.error('Error loading common numbers:', e);
            }
        }

        loadCommonNumbers();
        setInterval(loadCommonNumbers, 60000);
       // ============ SERVER-SENT EVENTS (SSE) FOR REAL-TIME UPDATES ============
let eventSource = null;
let reconnectAttempts = 0;
const maxReconnectAttempts = 10;

function connectSSE() {
    if (eventSource) {
        eventSource.close();
    }
    
    const backendUrl = 'https://teer-website-1.onrender.com';
    console.log('🔄 Connecting to SSE at:', `${backendUrl}/api/events`);
    
    eventSource = new EventSource(`${backendUrl}/api/events`);
    
    eventSource.onopen = () => {
        console.log('✅ SSE connection established!');
        reconnectAttempts = 0; // Reset reconnect attempts on successful connection
    };
    
    eventSource.onmessage = (event) => {
        console.log('📡 RAW SSE message received:', event.data);
        
        try {
            const data = JSON.parse(event.data);
            console.log('📡 Parsed data:', data);
            console.log('📡 Message type:', data.type);
            
            // Refresh on ANY update type (including common-update)
            if (data.type === 'cache-update' || 
                data.type === 'result-update' || 
                data.type === 'common-update' || 
                data.type === 'dream-update') {
                console.log('🔥 UPDATE DETECTED! Refreshing page NOW...');
                window.location.reload();
            } else if (data.type === 'connected') {
                console.log('✅ Connected to real-time updates');
            } else {
                console.log('📡 Unknown message type:', data.type);
            }
        } catch (e) {
            console.error('Error parsing SSE message:', e);
        }
    };
    
    eventSource.onerror = (error) => {
        console.error('⚠️ SSE error:', error);
        
        // Close the broken connection
        if (eventSource) {
            eventSource.close();
        }
        
        // Attempt to reconnect with exponential backoff
        if (reconnectAttempts < maxReconnectAttempts) {
            const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
            console.log(`🔄 Reconnecting in ${delay/1000} seconds... (Attempt ${reconnectAttempts + 1}/${maxReconnectAttempts})`);
            reconnectAttempts++;
            setTimeout(connectSSE, delay);
        } else {
            console.log('❌ Max reconnection attempts reached. Please refresh the page manually.');
        }
    };
}

// Start SSE connection when page loads
connectSSE();

// Also check cache version as fallback (every 10 seconds)
let currentCacheVersion = null;

async function checkCacheVersion() {
    try {
        const response = await fetch(`${API_BASE_URL}/api/cache-version`);
        const data = await response.json();
        
        if (currentCacheVersion !== null && currentCacheVersion !== data.version) {
            console.log('🔄 Cache version changed (fallback), refreshing...');
            window.location.reload();
        }
        currentCacheVersion = data.version;
    } catch (error) {
        console.log('Cache check failed:', error.message);
    }
}

// Fallback: Check every 10 seconds (in case SSE fails)
setInterval(checkCacheVersion, 10000);
checkCacheVersion();
