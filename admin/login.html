<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login | Khanapara Teer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="../assets/css/style.css" rel="stylesheet"/>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="text-center mb-4">
      <div style="font-size:48px;margin-bottom:12px;">🎯</div>
      <div class="brand-name" style="font-size:22px;">KHANAPARA TEER</div>
      <div class="text-muted small mt-1">Admin Panel — Secure Login</div>
    </div>

    <div id="loginError" class="alert-dark-error mb-3" style="display:none;">
      <i class="bi bi-exclamation-triangle me-2"></i>Invalid credentials. Try again.
    </div>

    <div class="mb-3">
      <label class="form-label-dark">Username</label>
      <input type="text" id="username" class="form-control-dark" placeholder="Enter username" autocomplete="username"/>
    </div>

    <div class="mb-4">
      <label class="form-label-dark">Password</label>
      <div class="position-relative">
        <input type="password" id="password" class="form-control-dark" placeholder="Enter password" autocomplete="current-password" style="padding-right:44px;"/>
        <button type="button" onclick="togglePass()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;">
          <i class="bi bi-eye" id="eyeIcon"></i>
        </button>
      </div>
    </div>

    <button class="btn-gold w-100 py-2 fs-6" onclick="doLogin()">
      <i class="bi bi-shield-lock me-2"></i>Login to Admin Panel
    </button>

    <div class="text-center mt-4">
      <a href="../index.html" class="text-muted text-decoration-none small">
        <i class="bi bi-arrow-left me-1"></i>Back to Website
      </a>
    </div>

    <div class="mt-4 pt-3" style="border-top:1px solid var(--border);">
      <p class="text-muted text-center small mb-0">
        Default: <code style="color:var(--gold);">admin</code> / <code style="color:var(--gold);">teer@2025</code>
      </p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script>
<script>
  if (isAdminLoggedIn()) window.location.href = 'index.html';

  function doLogin() {
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    if (adminLogin(u, p)) {
      window.location.href = 'index.html';
    } else {
      document.getElementById('loginError').style.display = 'block';
      document.getElementById('password').value = '';
    }
  }

  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  function togglePass() {
    const inp = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    if (inp.type === 'password') {
      inp.type = 'text';
      icon.className = 'bi bi-eye-slash';
    } else {
      inp.type = 'password';
      icon.className = 'bi bi-eye';
    }
  }
</script>
</body>
</html>
